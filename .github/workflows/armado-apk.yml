# Compila "Armado Paso a Paso" (WebView Android) y lo publica como Release con el APK.
name: Armado Paso a Paso - APK

on:
  push:
    branches: [armado-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: armado-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK de Android (ya instalado en el runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk ArmadoPasoAPaso.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArmadoPasoAPaso-apk
          path: ArmadoPasoAPaso.apk
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armado-v1.0.${{ github.run_number }}
          name: Armado Paso a Paso 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            App Android de Armado Paso a Paso. Descarga ArmadoPasoAPaso.apk en tu teléfono y ábrelo para instalar
            (Android te pedirá permitir instalar apps de esta fuente).
          files: ArmadoPasoAPaso.apk
          make_latest: false
