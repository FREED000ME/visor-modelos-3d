plugins { id 'com.android.application' }
android {
    namespace 'com.freed.armado'
    compileSdk 34
    defaultConfig {
        applicationId 'com.freed.armado'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
